# SwiftFormat configuration
# Derived from SWIFTSTYLE.md — keep code conforming to the style guide, not vice versa.
# Rules reference: https://github.com/nicklockwood/SwiftFormat/blob/master/Rules.md
#
# Layout: toolchain/scope first, then rules grouped by the SWIFTSTYLE.md section they
# enforce, then general hygiene and opt-in toggles. Entries are sorted within each group.

# === Toolchain & scope ===
--swiftversion 6.0
--exclude .build,build,Carthage,DerivedData,Pods

# === Indentation & width ===
# Guide uses 4-space indents; signatures/calls stay on one line, so never wrap on width.
--indent 4
--maxwidth none
--smarttabs enabled
--tabwidth 4

# === Formatting — explicit types (SWIFTSTYLE.md "Formatting") ===
# "Use explicit type annotations ... do not rely on type inference."
# Keep these DISABLED so SwiftFormat never strips an explicit type, rewrites the RHS to
# `.init(...)`, or collapses a `let x = E; return x` intermediate into a bare expression.
# (redundantProperty was renamed redundantVariable in 0.61; the old name is a deprecated no-op.)
--disable propertyTypes
--disable redundantType
--disable redundantVariable

# === Formatting — single-line calls/signatures (SWIFTSTYLE.md "Formatting") ===
# "Keep function calls, initializers, and signatures on a single line."
# preserve = never auto-wrap or unwrap, so SwiftUI modifier chains stay multi-line as authored.
--closingparen balanced
--disable wrap
--disable wrapMultilineStatementBraces
--wraparguments preserve
--wrapcollections preserve
--wrapconditions preserve
--wrapparameters preserve
--wrapreturntype preserve
--wraptypealiases preserve

# === Formatting — rewrites we never want made on our behalf ===
--disable andOperator
--disable fileHeader
--disable genericExtensions
--disable modifierOrder
--disable opaqueGenericParameters
--disable preferKeyPath
--disable redundantSendable
# Strips `Self.` off a static member referenced from a static context, which `--self insert`
# below then re-qualifies as `self.` — silently turning `Self.foo` into `self.foo`. Keep the
# explicit `Self.` the code was written with; SwiftLint's prefer_self_in_static_references
# asks for the same spelling.
--disable redundantStaticSelf
--disable redundantViewBuilder
--disable throwingTests
--disable unusedArguments

# === Imports (SWIFTSTYLE.md "Imports") ===
# "Foundation first, then Apple frameworks, then project modules" — SwiftFormat can't
# express that ordering, so leave import order to the author.
--disable sortImports

# === Control flow (SWIFTSTYLE.md "Control Flow") ===
# Prefer guard / early returns; keep else on the same line as the closing brace.
--elseposition same-line
--guardelse same-line

# === Documentation (SWIFTSTYLE.md "Documentation") ===
# `///` only on declarations, `//` inline — keep doc-comment normalization conservative.
--doccomments preserve

# === General hygiene (consistent with the guide) ===
--emptybraces no-space
--extensionacl on-declarations
--header strip
--marktypes never
--patternlet inline
--ranges no-space
--self insert
--semicolons never
--trailing-commas always
--trimwhitespace always

# === Opt-in rules we enable ===
--enable isEmpty
--enable redundantParens
--enable redundantReturn
--enable trailingClosures
